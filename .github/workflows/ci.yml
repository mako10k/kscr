name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test_clippy:
    name: test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test_clippy-

      - name: cargo test
        run: cargo test -- --test-threads=1

      - name: cargo fmt (check)
        run: cargo fmt -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-features -- -D warnings

  phase3d_typeclass_regressions:
    name: phase3d typeclass regressions (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-phase3d_typeclass_regressions-

      - name: typecheck transitive method-value regressions
        run: cargo test --lib typecheck_file_resolves_method_value_with_transitive_instance_ -- --test-threads=1

      - name: runtime transitive method-value regressions
        run: cargo test --lib ir_run_main_user_defined_typeclass_imports_instance_transitive_ -- --test-threads=1

      - name: cli transitive re-export regression
        run: cargo test --test cli_run_typeclass_transitive_reexport -- --test-threads=1

  unsafe_crates:
    name: unsafe crates (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unsafe_crates-

      - name: cargo test/clippy (kscr_unsafe_ffi)
        run: |
          cargo generate-lockfile --manifest-path crates/kscr_unsafe_ffi/Cargo.toml
          cargo test --manifest-path crates/kscr_unsafe_ffi/Cargo.toml --locked
          cargo clippy --manifest-path crates/kscr_unsafe_ffi/Cargo.toml --locked -- -D warnings

      - name: cargo test/clippy (kscr_unsafe_bigint)
        run: |
          cargo generate-lockfile --manifest-path crates/kscr_unsafe_bigint/Cargo.toml
          cargo test --manifest-path crates/kscr_unsafe_bigint/Cargo.toml --locked
          cargo clippy --manifest-path crates/kscr_unsafe_bigint/Cargo.toml --locked -- -D warnings


  nightly_udeps:
    name: nightly udeps (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly_udeps-

      - name: Install cargo-udeps
        run: |
          if cargo-udeps --version 2>/dev/null; then
            cargo-udeps --version
          else
            cargo install cargo-udeps --locked
          fi

      - name: cargo +nightly udeps
        run: cargo +nightly udeps
