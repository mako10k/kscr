name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test_clippy_geiger:
    name: test / clippy / geiger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test_clippy_geiger-

      - name: cargo test
        run: cargo test -- --test-threads=1

      - name: cargo fmt (check)
        run: cargo fmt -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-features -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked --version 0.13.0

      - name: cargo fetch (for geiger)
        run: cargo fetch --locked

      - name: cargo geiger
        run: |
          cargo geiger || (echo "cargo geiger failed; retrying" && cargo geiger)

  nightly_udeps:
    name: nightly udeps (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly_udeps-

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: cargo +nightly udeps
        run: cargo +nightly udeps
