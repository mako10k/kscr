name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test_clippy_geiger:
    name: test / clippy / geiger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test -- --test-threads=1

      - name: cargo fmt (check)
        run: cargo fmt -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: file size ratchet
        run: bash tools/ci/check_file_size_ratchet.sh

      - name: clippy metrics ratchet
        run: python3 tools/ci/check_clippy_metrics_ratchet.py

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked --version 0.13.0

      - name: cargo geiger
        run: |
          cargo fetch --locked
          cargo geiger --locked --offline

  nightly_udeps:
    name: nightly udeps (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: file size ratchet
        run: bash tools/ci/check_file_size_ratchet.sh

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: cargo +nightly udeps
        run: cargo +nightly udeps
