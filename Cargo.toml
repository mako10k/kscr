[package]
name = "kscr"
version = "0.3.5"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kscr"
path = "src/main.rs"

[[bin]]
name = "kscr-lsp"
path = "crates/kscr_lsp/src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[features]
# Optional features that may use `unsafe` are isolated behind flags.
# Keep these disabled in normal builds; enable explicitly when experimenting.
unsafe_ffi = ["dep:kscr_unsafe_ffi"]
unsafe_bigint = ["dep:kscr_unsafe_bigint"]
readline = ["dep:rustyline"]
llvm = ["dep:kscr_llvm"]

[dependencies]
kscr_ir = { path = "crates/kscr_ir" }
kscr_unsafe_ffi = { path = "crates/kscr_unsafe_ffi", optional = true }
kscr_unsafe_bigint = { path = "crates/kscr_unsafe_bigint", optional = true }
kscr_llvm = { path = "crates/kscr_llvm", optional = true }
rustyline = { version = "17", optional = true }


tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
dirs = "6"

[dev-dependencies]
tempfile = "3"
