[package]
name = "kscr"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kscr"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[features]
# Optional features that may use `unsafe` are isolated behind flags.
# Keep these disabled in normal builds; enable explicitly when experimenting.
unsafe_ffi = []
unsafe_bigint = ["dep:num-bigint"]

[dependencies]
num-bigint = { version = "0.4", optional = true }

